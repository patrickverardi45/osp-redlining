  <text x="20" y="356" fill="#475569" font-size="12">This figure is the DESTINATION. Today: M1–M3 proven on 4 bores; M4 negative banked; M5 coverage scoped.</text>
  <text x="20" y="378" fill="#0f172a" font-size="12" font-weight="700">Nothing here is a claim of current capability beyond the green (PROVEN) elements.</text>
